services:
  db:
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bilkent_secret_gifts_dev

  backend:
    command: >
      sh -c "python scripts/ensure_database.py &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment:
      - DB_NAME=bilkent_secret_gifts_dev
      - DEBUG=True

  frontend:
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api/

volumes:
  postgres_dev_data:
